name = "flaremail"
main = "worker/index.ts"
compatibility_date = "2026-08-19"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.25

[observability.traces]
enabled = true
head_sampling_rate = 0.05

[vars]
APP_ENV = "development"
ALLOW_FAKE_SERVICES = "true"
OUTBOUND_PROVIDER = "demo"
OUTBOUND_FROM_EMAIL = "dev@example.com"
OUTBOUND_FROM_NAME = "FlareMail"
AUTO_REPLY_ENABLED = "false"
AUTO_REPLY_SUBJECT_PREFIX = "Re:"
AUTO_REPLY_TEXT = "你好，我们已经收到你的邮件，会尽快处理。\n\nThis is an automated reply from FlareMail on Cloudflare Workers."
INBOUND_NOTIFICATION_ENABLED = "false"
INBOUND_MAX_RAW_BYTES = "26214400"
INBOUND_MAX_ATTACHMENT_COUNT = "50"
INBOUND_MAX_ATTACHMENT_BYTES = "15728640"
INBOUND_MAX_ATTACHMENT_TOTAL_BYTES = "25165824"
NOTIFICATION_EMAIL = "ops@example.com"
NOTIFICATION_SUBJECT_PREFIX = "[FlareMail] 新入站邮件"

# 生产环境请使用被忽略的 `wrangler.deploy.toml`，并遵循 `DEPLOY.md` 的
# `wrangler deploy --secrets-file` 原子发布流程；不要把真实密钥写入此模板。
#
# 请不要把真实邮箱、资源 ID 或生产配置直接提交到仓库。
# 推荐做法：
# - 本地开发：使用 `.dev.vars`（可参考 `.dev.vars.example`）
# - 生产部署：只使用被忽略的 `wrangler.deploy.toml`，参阅 `DEPLOY.md`
# - production 必须显式使用 `OUTBOUND_PROVIDER = "resend"`；fake 仅允许本地开发和测试

[assets]
directory = "build"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "flaremail-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "flaremail-bucket"
preview_bucket_name = "flaremail-bucket-preview"
