name: CI test partition

on:
  workflow_call:
    inputs:
      partition:
        type: string
        required: true

permissions:
  contents: read

jobs:
  run:
    name: Bun ${{ inputs.partition }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-flaremail
        with:
          cf: ${{ inputs.partition == 'remaining' && 'true' || 'false' }}
      - if: inputs.partition == 'remaining'
        run: bun run build:app
      - name: Run test partition
        shell: bash
        env:
          TEST_GROUP: ${{ inputs.partition }}
        run: |
          case "$TEST_GROUP" in
            unit|integration|remaining) bun run "test:$TEST_GROUP" ;;
            *) exit 1 ;;
          esac
