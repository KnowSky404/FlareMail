name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}${{ github.event.action == 'edited' && github.event.changes.base == null && '-metadata' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Scope and diff
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Select deterministic checks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          runtime=true
          dependencies=false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              git rev-parse --verify HEAD^2 >/dev/null
              BASE_SHA=$(git rev-parse HEAD^1)
              runtime=false ;;
            push) ;;
            workflow_dispatch) BASE_SHA=$(git rev-parse HEAD^) ;;
            *) exit 1 ;;
          esac
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 && "$GITHUB_EVENT_NAME" == push ]]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$BASE_SHA" HEAD
          paths=$(mktemp)
          trap 'rm -- "$paths"' EXIT
          git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/WORKFLOW.md|docs/DEVELOPMENT.md|docs/PREVIEW.md|docs/PRODUCTION_CHECKLIST.md)
                runtime=true ;;
              README.md|README.zh-CN.md|TODO.md|docs/*.md) ;;
              *) runtime=true ;;
            esac
            case "$path" in
              package.json|worker/package.json|bun.lock) dependencies=true ;;
            esac
          done < "$paths"
          printf 'runtime=%s\ndependencies=%s\n' "$runtime" "$dependencies" >> "$GITHUB_OUTPUT"

  unit:
    name: Tests (unit)
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    uses: ./.github/workflows/ci-tests.yml
    with:
      partition: unit

  integration:
    name: Tests (integration)
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    uses: ./.github/workflows/ci-tests.yml
    with:
      partition: integration

  remaining:
    name: Tests (remaining)
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    uses: ./.github/workflows/ci-tests.yml
    with:
      partition: remaining

  build:
    name: Types and Worker package
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-flaremail
      - run: bun run deploy:dry-run
      - run: bun run check
      - run: bun run cf:typegen --check

  chromium:
    name: chromium
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    uses: ./.github/workflows/ci-browser.yml
    with:
      suite: chromium

  webkit:
    name: webkit
    needs: scope
    if: needs.scope.result == 'success' && github.event_name != 'pull_request'
    uses: ./.github/workflows/ci-browser.yml
    with:
      suite: webkit

  firefox:
    name: firefox
    needs: scope
    if: needs.scope.result == 'success' && github.event_name != 'pull_request'
    uses: ./.github/workflows/ci-browser.yml
    with:
      suite: firefox

  a11y:
    name: a11y
    needs: scope
    if: needs.scope.result == 'success' && github.event_name != 'pull_request'
    uses: ./.github/workflows/ci-browser.yml
    with:
      suite: a11y

  dependency-audit:
    name: Dependency change audit
    needs: scope
    if: needs.scope.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun run audit:dependencies

  gate:
    name: >-
      ${{ github.event_name == 'push' && 'Main CI gate'
        || github.event_name == 'workflow_dispatch' && 'Manual CI gate'
        || github.event.action == 'edited' && github.event.changes.base == null && 'Metadata edit'
        || 'CI gate' }}
    if: always() && (github.event.action != 'edited' || github.event.changes.base != null)
    needs: [scope, unit, integration, remaining, build, chromium, dependency-audit, webkit, firefox, a11y]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the exact expected job results
        shell: bash
        env:
          SCOPE: ${{ needs.scope.result }}
          RUNTIME: ${{ needs.scope.outputs.runtime }}
          DEPENDENCIES: ${{ needs.scope.outputs.dependencies }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          REMAINING: ${{ needs.remaining.result }}
          BUILD: ${{ needs.build.result }}
          CHROMIUM: ${{ needs.chromium.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
          WEBKIT: ${{ needs.webkit.result }}
          FIREFOX: ${{ needs.firefox.result }}
          A11Y: ${{ needs.a11y.result }}
        run: |
          [[ "$SCOPE" == success ]]
          case "$RUNTIME" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          for result in "$UNIT" "$INTEGRATION" "$REMAINING" "$BUILD" "$CHROMIUM"; do
            [[ "$result" == "$expected" ]]
          done
          case "$DEPENDENCIES" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          [[ "$AUDIT" == "$expected" ]]
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            expected=skipped
          else
            expected=success
          fi
          [[ "$WEBKIT" == "$expected" && "$FIREFOX" == "$expected" && "$A11Y" == "$expected" ]]
