name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flaremail-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: dependency security audit
        run: bun run audit:dependencies
      - name: unit tests
        run: bun run test:unit
      - name: integration tests
        run: bun run test:integration
      - name: remaining tests
        run: bun run test:remaining
      - name: apply migrations to isolated local D1
        run: bun run db:migrate:local
      - name: search index verification
        run: bun run search:index -- --mode verify --json
      - run: bun run check
      - run: bun run cf:typegen -- --check
      - run: bun run build
      - run: bun run deploy:dry-run
      - name: release preflight
        run: bun run release:preflight -- --json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - name: Chromium E2E smoke with isolated synthetic fixtures
        run: bun run test:e2e
        env:
          CI: true
      - name: WebKit E2E smoke
        run: bun run test:e2e:webkit
        env:
          CI: true
      - run: bun run test:a11y
        env:
          CI: true
      - name: upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
