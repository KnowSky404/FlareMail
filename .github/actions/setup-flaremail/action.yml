name: Set up FlareMail checks
description: Install locked local dependencies and the pinned global Workers CLI
inputs:
  cf:
    description: Install the Cloudflare CLI for checks that need it
    default: 'true'
    required: false
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.22.1
        package-manager-cache: false
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.bun/install/cache
        key: bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json', 'bun.lock', 'worker/package.json') }}
    - shell: bash
      run: bun install --frozen-lockfile
    - if: inputs.cf == 'true'
      shell: bash
      run: |
        bun install --global cf@1.0.0-rc.1
        printf '%s\n' "$HOME/.bun/bin" >> "$GITHUB_PATH"
